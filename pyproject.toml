[project]
name = "Perception"
dynamic = ["version"]
description = "Perception provides flexible, well-documented, and comprehensively tested tooling for perceptual hashing research, development, and production use."
authors = [{ name = "Thorn", email = "info@wearethorn.org" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "numpy>=1.26.4,<3.0.0",
  "opencv-contrib-python-headless>=4.10.0,<5.0.0",
  "Pillow",
  "pywavelets>=1.5.0,<2.0.0",
  "validators>=0.22.0,<1.0.0",
  "rich>=13.7.0,<14.0.0",
  "scipy; python_version < '3.15'",
  # SciPy 1.17 lacks Python 3.15 wheels.
  "scipy>=1.18.1; python_version >= '3.15'",
  "tqdm>=4.67.1,<5.0.0",
  "typing_extensions>=4.0,<5.0",
]


[project.optional-dependencies]
# Networkit 11.2 has Linux ARM64 wheels for Python 3.11-3.13; 11.2.2 does not.
approximate-deduplication = [
  "faiss-cpu>=1.14.3,<2.0.0",
  "networkit==11.2; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version < '3.14'",
  "networkit>=11.2.2,<12.0.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'aarch64' and python_version >= '3.14') or (sys_platform == 'win32' and platform_machine == 'AMD64' and python_version < '3.15')",
  "networkx>=3.0,<4.0; (sys_platform != 'linux' and sys_platform != 'win32') or (sys_platform == 'linux' and platform_machine != 'x86_64' and platform_machine != 'aarch64') or (sys_platform == 'win32' and (platform_machine != 'AMD64' or python_version >= '3.15'))",
  "pandas",
]
benchmarking = [
  "matplotlib",
  "albumentations>=2.0.8,<3.0.0",
  "pandas",
  "tabulate",
  "scikit-learn",
  "ffmpeg-python",
]
matching = ["aiohttp", "python-json-logger"]
pdq = ["pdqhash>=0.2.7,<0.3.0"]

[dependency-groups]
dev = [
  "albumentations>=2.0.8,<3.0.0",
  "black==26.3.1",
  "coverage",
  "faiss-cpu>=1.14.3,<2.0.0",
  "ipython",
  "mypy",
  "networkit==11.2; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version < '3.14'",
  "networkit>=11.2.2,<12.0.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'aarch64' and python_version >= '3.14') or (sys_platform == 'win32' and platform_machine == 'AMD64' and python_version < '3.15')",
  "networkx>=3.0,<4.0",
  "pandas",
  "pandas-stubs",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "twine",
  "types-pillow",
  "types-tqdm",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["perception*"]

[tool.setuptools.package-data]
perception = ["py.typed"]
"perception.testing" = ["images/*", "logos/*", "videos/*"]

[tool.setuptools.exclude-package-data]
perception = ["*.cpp", "*.dylib", "*.pyd", "*.pyx", "*.so"]
"perception.benchmarking" = ["*.c", "*.dylib", "*.pyd", "*.pyx", "*.so"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.mypy]
exclude = ["/tests/"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
target-version = ["py311"]

[tool.uv]
# Albumentations pulls in `opencv-python-headless`, but perception needs
# contrib modules like `cv2.img_hash` and `cv2.SIFT_create`, which come from
# `opencv-contrib-python-headless`. Installing both distributions together
# causes file-level conflicts in the environment.
# NOTE: this setting only applies to uv. If you are using pip with the
# `benchmarking` extra, see the README for the required install procedure.
exclude-dependencies = ["opencv-python-headless"]

[build-system]
requires = [
  "Cython>=3.0.0,<4.0.0",
  "numpy>=1.26.4,<3.0.0",
  "setuptools>=82",
  "setuptools-scm>=10",
  "wheel",
]
build-backend = "setuptools.build_meta"
